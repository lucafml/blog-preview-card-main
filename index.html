<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Preview Card</title>
  <link rel="icon" href="assets/images/favicon-32x32.png" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <article class="card">
      <img src="assets/images/illustration-article.svg" alt="Article Illustration" class="illustration_image">
      <p class="category">Learning</p>
      <p class="published_date">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
      <h1 class="article_title"> <a href="#">HTML & CSS foundations</a></h1>
      <p class="article_description">These languages are the backbone of every website, defining structure, content, and
        presentation.</p>
      <footer class="author">
        <img src="assets/images/image-avatar.webp" alt="Avatar of Author Greg Hooper" class="author_avatar">
        <p class="author_name">Greg Hooper</p>
      </footer>
    </article>
  </main>
</body>

</html>
